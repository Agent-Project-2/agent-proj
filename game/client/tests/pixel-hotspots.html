<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>픽셀 현장 클릭 영역 회귀 검사</title>
  </head>
  <body>
    <p role="status">360px와 1000px 화면을 검사하고 있습니다.</p>
    <iframe title="검사할 게임" height="760"></iframe>
    <script type="module">
      const frame = document.querySelector("iframe");
      const status = document.querySelector("[role=status]");

      async function waitForStart(doc) {
        const deadline = Date.now() + 5000;
        while (!doc.querySelector("button")) {
          if (Date.now() > deadline) throw new Error("게임을 시작하지 못했습니다.");
          await new Promise((resolve) => setTimeout(resolve, 25));
        }
        await doc.fonts.ready;
      }

      function clickButton(doc, name) {
        const control = [...doc.querySelectorAll("button")].find(
          (button) => button.textContent.trim() === name,
        );
        if (!control) throw new Error(name + " 버튼이 없습니다.");
        control.click();
      }

      function clickArt(doc, x, y, expectedAction) {
        const image = doc.querySelector(".map-stage img, .room-stage img");
        const rect = image.getBoundingClientRect();
        const target = doc.elementFromPoint(rect.left + x * rect.width, rect.top + y * rect.height);
        if (target?.closest("button")?.getAttribute("aria-label") !== expectedAction) {
          throw new Error(expectedAction + " 그림 좌표가 클릭 영역에서 벗어났습니다.");
        }
        target.click();
      }

      async function checkRoomArt(doc, expectedWidth) {
        const art = doc.querySelector(".room-stage img");
        await art.decode();
        if (art.naturalWidth !== expectedWidth) {
          throw new Error("화면 폭에 맞는 현장 그림을 불러오지 못했습니다.");
        }
      }

      async function testWidth(width) {
        const expectedArtWidth = width === 360 ? 176 : 624;
        frame.width = width;
        const loaded = new Promise((resolve) =>
          frame.addEventListener("load", resolve, { once: true }),
        );
        frame.src = "../index.html?testWidth=" + width;
        await loaded;
        const doc = frame.contentDocument;
        await waitForStart(doc);
        clickButton(doc, "새 조사 시작");
        // Test the illustrated roofs and props as well as the floating labels.
        clickArt(doc, 0.88, 0.49, "기록실 현장 조사");
        await checkRoomArt(doc, expectedArtWidth);
        clickArt(doc, 0.35, 0.76, "출입 기록함 잠금 조건 보기");
        if (!doc.querySelector(".locked-hint")) throw new Error("기록함이 처음부터 열려 있습니다.");
        clickButton(doc, "지도로");
        clickArt(doc, 0.48, 0.12, "후문 통로 현장 조사");
        await checkRoomArt(doc, expectedArtWidth);
        clickArt(doc, 0.38, 0.95, "후문 문턱 조사");
        clickButton(doc, "지도로");
        clickArt(doc, 0.88, 0.49, "기록실 현장 조사");
        clickArt(doc, 0.35, 0.76, "출입 기록함 조사");
        clickButton(doc, "지도로");
        clickArt(doc, 0.16, 0.42, "전시장 현장 조사");
        await checkRoomArt(doc, expectedArtWidth);
        clickArt(doc, 0.86, 0.77, "안내 데스크 조사");
        clickButton(doc, "지도로");
        if (doc.querySelectorAll(".clue-list li").length !== 3) {
          throw new Error("세 장소의 증거가 수첩에 반영되지 않았습니다.");
        }
      }

      try {
        for (const width of [360, 1000]) await testWidth(width);
        status.textContent =
          "통과 · 360px 및 1000px에서 건물과 조사물 6곳의 클릭, 기록함 해제, 증거 3건을 확인했습니다.";
      } catch (error) {
        status.textContent = "실패 · " + error.message;
        throw error;
      }
    </script>
  </body>
</html>
